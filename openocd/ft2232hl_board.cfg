# ##########################################################
# FT2232HL Board V3.6 (arm8686) как JTAG-адаптер для K1921VG1T
# ##########################################################
#
# Разводка сверена по схеме "FT2232HL Board sch V3.6.pdf" и
# руководству производителя (FT2232HL 用作 openOCD V0.1):
# JTAG выведен на канал B (BDBUS) = ftdi channel 1.
# Цитата из их конфига: "According to the sch file, it uses BDBUS."
#
# Соответствие ног FT2232HL канала B и разъёма CN4:
#   BD0 = TCK  (CN4 pin 9)      BD3 = TMS  (CN4 pin 7)
#   BD1 = TDI  (CN4 pin 5)      BD4 = nTRST(CN4 pin 3)
#   BD2 = TDO  (CN4 pin 13, вход)  BD6 = nSRST/RESET (CN4 pin 15)
#
# Синтаксис осовременён под свежий OpenOCD (команды через пробел).
# Значения layout_init/сигналов НЕ менялись — они соответствуют железу.

# --- адаптер, транспорт, канал ---
# (драйвер WinUSB для Interface 1 ставится через Zadig)
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 1
transport select jtag

# КРИТИЧНО для К1921ВГ1Т: TCK не более 200-250 кГц.
# Внимание: target/k1921vg1t_singlecore.cfg подгружается ПОСЛЕ
# этого файла и выставляет 'adapter speed 2000', поэтому 200 нужно
# ещё раз форсировать в командной строке ПОСЛЕ -f target
# (см. команду запуска). Здесь — базовое значение.
adapter speed 200

# --- начальные значения и направления линий MPSSE ---
# data=0x00F8, direction=0x00FB (из конфига производителя).
# bit2 (TDO) = вход, остальные задействованные линии = выходы.
ftdi layout_init 0x00F8 0x00FB

# --- сигналы сброса (active-low, open-drain через -oe) ---
ftdi layout_signal nSRST -oe 0x0040
ftdi layout_signal nTRST -oe 0x0010
