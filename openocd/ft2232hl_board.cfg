# FT2232HL Board V3.6 (arm8686) as a JTAG adapter for K1921VG1T.
# Adapted from the OpenOCD configuration in the board manual; syntax updated for
# current OpenOCD, pin mapping verified against the V3.6 schematic.
# JTAG uses channel B (BDBUS) = ftdi channel 1.
#
# FT2232HL channel B to CN4 connector:
#   BD0 = TCK   (CN4 pin 9)      BD3 = TMS          (CN4 pin 7)
#   BD1 = TDI   (CN4 pin 5)      BD4 = nTRST        (CN4 pin 3)
#   BD2 = TDO   (CN4 pin 13)     BD6 = nSRST/RESET  (CN4 pin 15)
#
# Windows: install the WinUSB driver for Interface 1 with Zadig.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 1
transport select jtag

# K1921VG1T requires TCK <= 200-250 kHz.
adapter speed 200

# MPSSE initial data/direction, taken unchanged from the manufacturer config:
# TDO (bit 2) is an input, the other used lines are outputs.
ftdi layout_init 0x00F8 0x00FB

# Reset lines are active low, driven open-drain (-oe).
ftdi layout_signal nSRST -oe 0x0040
ftdi layout_signal nTRST -oe 0x0010
