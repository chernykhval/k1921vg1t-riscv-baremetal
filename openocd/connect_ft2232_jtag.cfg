# ##########################################################
# connect_ft2232_jtag.cfg — единая точка входа для подключения
# ##########################################################
#
# Сделано по образцу НИИЭТ:
#   k1921vg1t_sdk/tools/openocd/openocd-snippets/k1921vg1t/connect_jlink_jtag.cfg
# Логика та же: интерфейс -> target -> зафиксировать параметры -> init.
#
# ЗАПУСК (каталог скриптов указываем через -s):
#   openocd -s C:\niiet\k1921vg1t-project\openocd -f connect_ft2232_jtag.cfg
#     -> останется висеть и слушать :3333 (gdb), :4444 (telnet) — режим отладки.
#
#   openocd -s C:\niiet\k1921vg1t-project\openocd -f connect_ft2232_jtag.cfg -c "shutdown"
#     -> просто проверить связь с чипом и выйти.
#
# Признак успеха: оба TAP'а найдены (0xdeb15001),
# "Examined RISC-V core; found 1 harts", "hart 0: XLEN=32, misa=0x4014912d".

# --- Интерфейс: FT2232HL Board V3.6, канал B (BDBUS), TCK 200 кГц ---
source [find ft2232hl_board.cfg]

# --- Цель: К1921ВГ1Т, одноядерный режим ---
# (объявлены оба TAP'а цепочки, оживляем доступное загрузочное ядро)
source [find k1921vg1t_singlecore_dev.cfg]

# --- Фиксируем скорость ПОСЛЕ target-конфига ---
# У НИИЭТ в target-файлах зашита недопустимая для ВГ1Т скорость (2000 кГц),
# поэтому в их connect-скриптах она тоже переопределяется в самом конце.
# У нас в своём target уже стоит 200, но дублируем явно — так надёжнее.
adapter speed 200

init

# --- На будущее (Ступень 4Б, прошивка) ---
# Когда вернём провод nRST (CN4 pin15 -> XP7 pin10) и сменим в target-конфиге
# reset_config none -> reset_config srst_only srst_open_drain,
# сюда можно добавить (как в connect_jlink_jtag.cfg у НИИЭТ):
#   reset init
#   flash probe 0
