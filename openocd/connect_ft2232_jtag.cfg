# Entry point: FT2232HL Board (JTAG) + K1921VG1T, single-core target.
# Modelled on the NIIET snippet
#   k1921vg1t_sdk/tools/openocd/openocd-snippets/k1921vg1t/connect_jlink_jtag.cfg
#
# Usage (run from the repository root):
#   openocd -s ./openocd -f connect_ft2232_jtag.cfg              # debug server: gdb :3333, telnet :4444
#   openocd -s ./openocd -f connect_ft2232_jtag.cfg -c shutdown  # connection check only
#
# Expected output: both TAPs found (0xdeb15001),
# "Examined RISC-V core; found 1 harts", "hart 0: XLEN=32, misa=0x4014912d".

source [find ft2232hl_board.cfg]
source [find k1921vg1t_singlecore_dev.cfg]

# Set the speed again after the target config: some target configs (e.g. the
# NIIET ones) set 2000 kHz, while K1921VG1T needs TCK <= 200-250 kHz.
adapter speed 200

init
