# K1921VG1T single-core target.
# Derived from k1921vg1t_singlecore.cfg of the NIIET SDK. Changes:
#   1. expected-id 0xDEB05001 -> 0xDEB15001: the ID actually read from the chip
#      (the same value as in the NIIET dual-core config k1921vg1t.cfg).
#   2. adapter speed 2000 -> 200: K1921VG1T requires TCK <= 200-250 kHz.
#   3. reset_config trst_and_srst -> none: with "trst_and_srst" and with
#      "srst_only srst_open_drain" the SRST line stays asserted and the chip is
#      held in reset ("all ones" on the JTAG scan, the RESET LED on the board is on).
#      The nRST wire may stay connected; it is simply not used.
#      The core is halted through the Debug Module instead; after flashing,
#      start the new firmware with the RESET button (SB2).
#   4. Both TAPs of the dual-core chain are declared as cpu0/cpu1 (IR length 5+5),
#      but a target is created only for the boot core: the first TAP (found
#      empirically: XLEN=32, misa=0x4014912d). The second core is parked by the
#      factory firmware and its hart is not available.

adapter speed 200
reset_config none

set _CHIPNAME K1921VG1T

# The first TAP is the boot core that is examined; the second core stays in BYPASS.
jtag newtap $_CHIPNAME cpu0 -irlen 5 -expected-id 0xDEB15001
jtag newtap $_CHIPNAME cpu1 -irlen 5 -expected-id 0xDEB15001

set _TARGETNAME $_CHIPNAME.cpu0
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0

# SRAM work area used by the flash driver.
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x8000
}

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_CHIPNAME.flash k1921vg1t 0x0 0 0 16 $_TARGETNAME

proc sw_reset_halt {} {
	reset halt
}
