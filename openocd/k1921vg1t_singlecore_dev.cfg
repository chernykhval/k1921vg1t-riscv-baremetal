# ##########################################################
# K1921VG1T single-core target — НАША рабочая копия
# ##########################################################
#
# Копия k1921vg1t_singlecore.cfg (НИИЭТ) с правками под наше
# железо и текущий этап bring-up. Оригинал НЕ трогаем.
#
# Отличия от оригинала:
#   1. expected-id: 0xDEB05001 -> 0xDEB15001
#      Реальный ID нашего кристалла (прочитан по JTAG). Совпадает
#      с дуал-кор конфигом НИИЭТ k1921vg1t.cfg (_CPUTAPID=0xDEB15001).
#   2. adapter speed: 2000 -> 200
#      Для ВГ1Т TCK <= 200-250 кГц; 2000 недопустимо.
#   3. reset_config: trst_and_srst -> none  (OpenOCD НЕ трогает линию сброса)
#      Проверено на железе: и "trst_and_srst", и "srst_only srst_open_drain"
#      приводят к тому, что nSRST зажимается и не отпускается -> чип остаётся
#      в сбросе, скан JTAG даёт "all ones" (на плате при этом горит зелёный
#      светодиод RESET — см. РЭ платы КФДЛ.441461.050 §2.6).
#      Обход: ядро останавливаем через Debug Module (он вшит в кремний и
#      работает без nRST), а новую прошивку запускаем кнопкой RESET (SB2).
#      Провод nRST можно оставить подключённым — он просто не используется.
#      TODO (эксперимент Б): объявить в interface-конфиге nSRST как
#      "-ndata 0x0040" (явный уровень, активный ноль) + srst_push_pull.
#   4. Объявлены ОБА TAP'а цепочки (чип двухъядерный), но оживляем
#      (target create) только доступное загрузочное ядро — оно ПЕРВОЕ
#      в цепочке (эмпирически: именно первый tap отвечает корректно,
#      XLEN=32, misa=0x4014912d). Второе ядро на старте припарковано
#      заводской прошивкой -> его hart недоступен, оставляем его
#      BYPASS-TAP'ом без target. Это убирает авто-обнаружение и даёт
#      корректную длину IR цепочки (5+5 бит).

adapter speed 200
reset_config none

set _CHIPNAME K1921VG1T

# Порядок важен: ПЕРВЫЙ tap = доступное ядро (его оживляем).
jtag newtap $_CHIPNAME cpu0 -irlen 5 -expected-id 0xDEB15001
jtag newtap $_CHIPNAME cpu1 -irlen 5 -expected-id 0xDEB15001

# Оживляем только доступное ядро (первый tap).
set _TARGETNAME $_CHIPNAME.cpu0
target create $_TARGETNAME riscv -endian little -chain-position $_TARGETNAME -coreid 0

# Work-area — область в SRAM для программирования flash
if { [info exists WORKAREASIZE] } {
   set _WORKAREASIZE $WORKAREASIZE
} else {
   set _WORKAREASIZE 0x8000
}

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_CHIPNAME.flash k1921vg1t 0x0 0 0 16 $_TARGETNAME

proc sw_reset_halt {} {
	reset halt
}
