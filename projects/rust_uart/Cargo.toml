# Step 5: text output over UART0 (9600 8N1) and measurement of the internal HSI frequency.
[package]
name = "rust_uart"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
