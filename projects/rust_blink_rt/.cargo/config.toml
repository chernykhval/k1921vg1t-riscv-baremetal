# .cargo/config.toml — цель и флаг линкера.
# link.x теперь даёт riscv-rt (его build.rs кладёт link.x на путь поиска),
# поэтому -Tlink.x найдёт скрипт из крейта, а не наш (у нас его и нет).

[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
rustflags = ["-C", "link-arg=-Tlink.x"]
