# Step 2: the same blink on top of the riscv-rt runtime (startup code and link.x from the crate).
[package]
name = "rust_blink_rt"
version = "0.1.0"
edition = "2021"

[dependencies]
# memory:      riscv-rt includes our memory.x;
# single-hart: start only one hart (the program runs on hart 0; the second core is not used).
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
