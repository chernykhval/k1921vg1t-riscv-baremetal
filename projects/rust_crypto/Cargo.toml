# Step 8: hardware GOST Kuznyechik encryption with the CRYPTO block, checked against the
# GOST R 34.12-2015 test vector.
[package]
name = "rust_crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
