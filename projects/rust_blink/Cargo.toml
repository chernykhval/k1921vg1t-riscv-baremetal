# Step 1: blink LED1 with no crates at all — own startup code and linker script.
[package]
name = "rust_blink"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust_blink"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"

# No dependencies: only `core` (no_std).
[dependencies]
