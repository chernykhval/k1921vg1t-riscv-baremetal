# Step 7: DAC0 signal generator (64-point sine table), output on the SMA connector labelled "DAC 0".
[package]
name = "rust_dac"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
