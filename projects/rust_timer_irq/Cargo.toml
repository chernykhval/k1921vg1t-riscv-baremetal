# Step 4: LED1 toggled from the TMR0 interrupt (TMR0 -> PLIC -> machine external interrupt).
[package]
name = "rust_timer_irq"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }
riscv = "0.16"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
