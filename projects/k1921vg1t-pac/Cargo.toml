# Cargo.toml — крейт доступа к периферии (PAC), сгенерирован svd2rust из SVD К1921ВГ1Т
[package]
name = "k1921vg1t-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for NIIET K1921VG1T (RISC-V) — generated by svd2rust"
license = "MIT OR Apache-2.0"

[dependencies]
critical-section = { version = "1.0", optional = true }
riscv = "0.12"
riscv-rt = { version = "0.13", optional = true }
vcell = "0.1.3"

[features]
rt = ["riscv-rt"]
