# Peripheral access crate for K1921VG1T, generated by svd2rust from the patched NIIET SVD.
# License composition: see NOTICE.md in the repository root.
[package]
name = "k1921vg1t-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for NIIET K1921VG1T (RISC-V) — generated by svd2rust"
license = "LicenseRef-NIIET-Open-License AND CC-BY-4.0 AND (MIT OR Apache-2.0)"
authors = ["Valentin Chernykh"]
repository = "https://github.com/chernykhval/k1921vg1t-riscv-baremetal"

[dependencies]
critical-section = { version = "1.0", optional = true }
riscv = "0.12"
riscv-rt = { version = "0.13", optional = true }
vcell = "0.1.3"

[features]
rt = ["riscv-rt"]
