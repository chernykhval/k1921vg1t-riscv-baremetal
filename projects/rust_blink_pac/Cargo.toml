# Step 3: the same blink through the generated PAC (named registers instead of raw addresses).
[package]
name = "rust_blink_pac"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
