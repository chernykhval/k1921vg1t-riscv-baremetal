# Step 6: thermometer — the ADC measures the on-chip temperature sensor (TSENSOR), output over UART.
[package]
name = "rust_adc"
version = "0.1.0"
edition = "2021"

[dependencies]
riscv-rt = { version = "0.18.0", features = ["memory", "single-hart"] }
k1921vg1t-pac = { path = "../k1921vg1t-pac" }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
